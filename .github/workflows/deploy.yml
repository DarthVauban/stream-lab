name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run security audit
        run: npm run audit:security

      - name: Build web application
        run: npm run build

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image base name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push media-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-media:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-media:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-web:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: GHCR_ACTOR,GHCR_TOKEN,GITHUB_SHA
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd stream-lab
            git pull --ff-only
            previous_tag=latest
            if [ -f .deploy-tag ]; then previous_tag=$(cat .deploy-tag); fi
            new_tag="sha-$GITHUB_SHA"
            export IMAGE_TAG="$new_tag"
            export STREAMLAB_DOMAIN="stream.mt-panel.sbs"
            export AUTH_COOKIE_SECURE="true"
            docker compose --profile production pull media-server web caddy
            if ! docker compose --profile production up -d --wait --wait-timeout 120; then
              echo "Deployment failed, rolling back to $previous_tag"
              export IMAGE_TAG="$previous_tag"
              docker compose --profile production pull media-server web caddy
              docker compose --profile production up -d --wait --wait-timeout 120
              exit 1
            fi
            printf '%s\n' "$new_tag" > .deploy-tag
            docker image prune -af
