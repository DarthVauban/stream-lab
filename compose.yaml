services:
  media-server:
    image: ghcr.io/darthvauban/stream-lab-media:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      MEDIA_API_HOST: 0.0.0.0
      MEDIA_API_PORT: 8788
      MEDIA_DATA_DIR: /app/data
      MEDIA_ALLOWED_ORIGINS: ${MEDIA_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      MVP_VIDEO_BITRATE: 10M
      MVP_AUDIO_BITRATE: 128k
    volumes:
      - ./data:/app/data

  web:
    image: ghcr.io/darthvauban/stream-lab-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_MEDIA_API_URL: ${NEXT_PUBLIC_MEDIA_API_URL:-http://127.0.0.1:8788}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - media-server
