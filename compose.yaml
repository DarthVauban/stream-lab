services:
  caddy:
    image: caddy:2.11.4-alpine
    profiles:
      - production
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      STREAMLAB_DOMAIN: ${STREAMLAB_DOMAIN:-stream.mt-panel.sbs}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media-server:
    image: ghcr.io/darthvauban/stream-lab-media:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8788"
    security_opt:
      - no-new-privileges:true
    environment:
      MEDIA_API_HOST: 0.0.0.0
      MEDIA_API_PORT: 8788
      MEDIA_DATA_DIR: /app/data
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      MEDIA_TRANSCODE_VIDEO_BITRATE: ${MEDIA_TRANSCODE_VIDEO_BITRATE:-8M}
      MEDIA_TRANSCODE_PRESET: ${MEDIA_TRANSCODE_PRESET:-veryfast}
      MEDIA_KEEP_ORIGINAL_UPLOADS: ${MEDIA_KEEP_ORIGINAL_UPLOADS:-false}
      MVP_VIDEO_BITRATE: ${MVP_VIDEO_BITRATE:-8M}
      MVP_AUDIO_BITRATE: ${MVP_AUDIO_BITRATE:-192k}
      PLAYOUT_UDP_PORT: ${PLAYOUT_UDP_PORT:-23000}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?OWNER_PASSWORD_HASH is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      STREAM_CONFIG_SECRET: ${STREAM_CONFIG_SECRET:?STREAM_CONFIG_SECRET is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      YOUTUBE_TOKEN_SECRET: ${YOUTUBE_TOKEN_SECRET:-}
      YOUTUBE_DAILY_QUOTA: ${YOUTUBE_DAILY_QUOTA:-10000}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      STREAM_RECONNECT_BASE_MS: ${STREAM_RECONNECT_BASE_MS:-2000}
      STREAM_RECONNECT_MAX_MS: ${STREAM_RECONNECT_MAX_MS:-300000}
      STREAM_STABLE_RUN_MS: ${STREAM_STABLE_RUN_MS:-60000}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ghcr.io/darthvauban/stream-lab-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MEDIA_INTERNAL_API_URL: http://media-server:8788
    ports:
      - "3000:3000"
    depends_on:
      media-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
