services:
  media-server:
    build:
      context: .
      dockerfile: Dockerfile.media
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      MEDIA_API_HOST: 0.0.0.0
      MEDIA_API_PORT: 8788
      MEDIA_DATA_DIR: /app/data
      MEDIA_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      MVP_VIDEO_BITRATE: 10M
      MVP_AUDIO_BITRATE: 128k
    volumes:
      - ./data:/app/data

