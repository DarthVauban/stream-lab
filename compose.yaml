services:
  media-server:
    image: ghcr.io/darthvauban/stream-lab-media:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8788"
    security_opt:
      - no-new-privileges:true
    environment:
      MEDIA_API_HOST: 0.0.0.0
      MEDIA_API_PORT: 8788
      MEDIA_DATA_DIR: /app/data
      MVP_VIDEO_BITRATE: 10M
      MVP_AUDIO_BITRATE: 128k
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?OWNER_PASSWORD_HASH is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ghcr.io/darthvauban/stream-lab-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MEDIA_INTERNAL_API_URL: http://media-server:8788
    ports:
      - "3000:3000"
    depends_on:
      media-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
