x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_DB: streamlab
      POSTGRES_USER: streamlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamlab -d streamlab"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2.11.4-alpine
    profiles:
      - production
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      STREAMLAB_DOMAIN: ${STREAMLAB_DOMAIN:-stream.mt-panel.sbs}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media-server:
    image: ghcr.io/darthvauban/stream-lab-media:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8788"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      MEDIA_API_HOST: 0.0.0.0
      MEDIA_API_PORT: 8788
      MEDIA_DATA_DIR: /app/data
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      MEDIA_TRANSCODE_VIDEO_BITRATE: ${MEDIA_TRANSCODE_VIDEO_BITRATE:-8M}
      MEDIA_TRANSCODE_PRESET: ${MEDIA_TRANSCODE_PRESET:-veryfast}
      MEDIA_ENCODER_MODE: ${MEDIA_ENCODER_MODE:-AUTO}
      MEDIA_KEEP_ORIGINAL_UPLOADS: ${MEDIA_KEEP_ORIGINAL_UPLOADS:-false}
      MEDIA_COMPRESSION_PROFILE: ${MEDIA_COMPRESSION_PROFILE:-STANDARD}
      UPLOAD_PROGRESS_PERSIST_MS: ${UPLOAD_PROGRESS_PERSIST_MS:-5000}
      MVP_VIDEO_BITRATE: ${MVP_VIDEO_BITRATE:-8M}
      MVP_AUDIO_BITRATE: ${MVP_AUDIO_BITRATE:-128k}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?OWNER_PASSWORD_HASH is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      STREAM_CONFIG_SECRET: ${STREAM_CONFIG_SECRET:?STREAM_CONFIG_SECRET is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      YOUTUBE_TOKEN_SECRET: ${YOUTUBE_TOKEN_SECRET:-}
      YOUTUBE_DAILY_QUOTA: ${YOUTUBE_DAILY_QUOTA:-10000}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-https://stream.mt-panel.sbs/api/telegram/webhook}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      STREAM_RECONNECT_BASE_MS: ${STREAM_RECONNECT_BASE_MS:-2000}
      STREAM_RECONNECT_MAX_MS: ${STREAM_RECONNECT_MAX_MS:-300000}
      STREAM_STABLE_RUN_MS: ${STREAM_STABLE_RUN_MS:-60000}
      PLAYOUT_PREWARM_LEAD_MS: ${PLAYOUT_PREWARM_LEAD_MS:-1500}
      STREAM_NETWORK_TIMEOUT_MS: ${STREAM_NETWORK_TIMEOUT_MS:-15000}
      DATABASE_URL: postgresql://streamlab:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/streamlab
      REDIS_URL: redis://redis:6379
      STORAGE_WARNING_PERCENT: ${STORAGE_WARNING_PERCENT:-80}
      STORAGE_CRITICAL_PERCENT: ${STORAGE_CRITICAL_PERCENT:-90}
      SYSTEM_MONITOR_INTERVAL_MS: ${SYSTEM_MONITOR_INTERVAL_MS:-2000}
      SOAK_TEST_SAMPLE_INTERVAL_MS: ${SOAK_TEST_SAMPLE_INTERVAL_MS:-60000}
      SOAK_TEST_MAX_RSS_GROWTH_PERCENT: ${SOAK_TEST_MAX_RSS_GROWTH_PERCENT:-30}
      SOAK_TEST_MAX_TEMP_GROWTH_BYTES: ${SOAK_TEST_MAX_TEMP_GROWTH_BYTES:-536870912}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ghcr.io/darthvauban/stream-lab-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      MEDIA_INTERNAL_API_URL: http://media-server:8788
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      media-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  backup-scheduler:
    image: postgres:17-alpine
    profiles:
      - production
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: streamlab
      POSTGRES_USER: streamlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./data:/source-data:ro
      - ./backups:/backups
      - ./scripts/backup-entrypoint.sh:/opt/streamlab/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/streamlab/backup-entrypoint.sh"]
    command: ["schedule"]
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    profiles:
      - maintenance
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: streamlab
      POSTGRES_USER: streamlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./data:/source-data
      - ./backups:/backups
      - ./scripts/backup-entrypoint.sh:/opt/streamlab/backup-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/opt/streamlab/backup-entrypoint.sh"]
    command: ["help"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
